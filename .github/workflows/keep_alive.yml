name: Supabase Keep-Alive Diario

on:
  schedule:
    # 02:00 UTC = 23:00 Horario de Brasilia (BRT) todos os dias
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite disparar o teste manualmente pelo painel do GitHub Actions

jobs:
  keep-alive:
    name: Ping Diario & Limpeza Semanal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Executar Keep-Alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://evqjlgfhdpisxxbvxelh.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_YLDCZL8qtWXqIFEeH7QzfQ_zf7v5gcQ' }}
        run: |
          python keep_alive_supabase.py
